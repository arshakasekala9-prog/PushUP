<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="beruang-192.png">
<link rel="apple-touch-icon" href="beruang-192.png">
<title>SYSTEM - Push Up Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#05070f;--panel:#0a1226;--line:#2b6dff;--glow:#4aa3ff;--txt:#dce8ff;--dim:#7d90b8;--ok:#3de0a0;--warn:#ffc857;--bad:#ff5c7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0d1a3d 0,#05070f 420px),#05070f;color:var(--txt);font-family:Orbitron,"Segoe UI",Arial,sans-serif;font-size:14px;min-height:100vh;overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;padding:14px 14px 90px}
.panel{background:linear-gradient(180deg,rgba(14,28,64,.85),rgba(8,16,36,.9));border:1px solid var(--line);padding:14px;margin-bottom:14px;position:relative}
.panel>h3,.tag{margin:0 0 10px;font-size:12px;letter-spacing:2px;color:var(--glow);text-transform:uppercase}
.panel>h3::before{content:"[ ";color:var(--dim)}.panel>h3::after{content:" ]";color:var(--dim)}
.title{text-align:center;letter-spacing:4px;font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 12px var(--glow);margin:6px 0 16px}
label{display:block;font-size:11px;color:var(--dim);letter-spacing:1px;margin:10px 0 4px}
input,select{width:100%;background:#050b1c;border:1px solid var(--line);color:#fff;padding:11px;font:inherit;font-size:15px;outline:none}
input:focus{box-shadow:0 0 8px var(--glow)}
button{font:inherit;background:transparent;color:#fff;border:1px solid var(--glow);padding:11px 14px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;font-size:12px}
button:hover,button.on{background:rgba(74,163,255,.2);box-shadow:0 0 10px var(--glow)}
button.big{width:100%;padding:15px;font-size:14px;font-weight:700}
button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
button.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.diff{padding:10px;text-align:left}.diff small{display:block;color:var(--dim);font-size:10px;margin-top:3px;text-transform:none;letter-spacing:0}
.bar{height:10px;background:#0a1330;border:1px solid #1d3a80;margin:6px 0 2px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#1f58ff,#4aa3ff);box-shadow:0 0 8px var(--glow);transition:none}
.bar.q>i{background:linear-gradient(90deg,#17a673,var(--ok))}
.small{font-size:11px;color:var(--dim)}
.rank{width:78px;height:78px;border:2px solid var(--glow);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;text-shadow:0 0 14px var(--glow);box-shadow:0 0 16px var(--line),inset 0 0 14px rgba(43,109,255,.4);flex:none}
.rank.S{color:var(--warn);border-color:var(--warn);text-shadow:0 0 14px var(--warn)}
.head{display:flex;gap:14px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:17px;color:#fff}.stats span{font-size:10px;color:var(--dim);letter-spacing:1px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#050a18;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-right:1px solid #12306e;padding:15px 0;font-size:9px;color:var(--dim)}
nav button.on{color:#fff;background:rgba(74,163,255,.18);box-shadow:inset 0 2px 0 var(--glow)}
.mv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #12306e}
.mv:last-child{border:0}.mv .n{font-weight:700}.mv input{width:80px;text-align:center;padding:9px}
.lock{opacity:.5}
.rw{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #12306e;align-items:center}
.rw.open .st{color:var(--ok)}.rw .st{font-size:11px;color:var(--dim);white-space:nowrap}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line);background:#000}
.photos div{text-align:center;font-size:10px;color:var(--dim)}
#ov{position:fixed;inset:0;background:rgba(2,4,10,.96);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#ov.show{display:flex}
#cnt{font-size:110px;font-weight:900;color:#fff;text-shadow:0 0 24px var(--glow);line-height:1}
#stat{margin:10px 0;font-size:16px;letter-spacing:3px}
.near{color:var(--ok)}.far{color:var(--glow)}
.pop{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(2,6,20,.88);padding:20px}
.pop.show{display:flex}.pop .panel{text-align:center;width:100%;max-width:380px;animation:shake .5s}
.pop h2{font-size:26px;margin:6px 0;color:#fff;text-shadow:0 0 16px var(--glow);letter-spacing:3px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#0a1a44;border:1px solid var(--glow);padding:10px 16px;z-index:40;display:none;font-size:12px;box-shadow:0 0 14px var(--glow);max-width:90%;text-align:center}
.pv{width:120px;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line);display:none;margin-top:8px}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

nav button{letter-spacing:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{border:1px solid #1d3a80;padding:7px 0;font-size:10px;position:relative}
.wd.now{border-color:#fff;box-shadow:0 0 8px var(--glow)}
.wd span{display:block;color:var(--glow);margin-top:4px;font-size:8px}
.wd.rs span{color:var(--dim)}
.wd em{position:absolute;top:1px;right:3px;font-style:normal;color:var(--ok);font-size:9px}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #12306e;margin:0;color:var(--txt);font-size:13px;letter-spacing:0}
label.chk input{width:22px;height:22px;flex:none;padding:0;accent-color:#4aa3ff}
label.chk small{color:var(--dim);font-size:11px}
.exc{padding:12px 0;border-bottom:1px solid #12306e}.exc:last-child{border:0}
.exc .n{font-weight:700}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sst{width:64px}.sst small{display:block;font-size:9px;color:var(--dim);margin-bottom:2px}
.sst input{padding:9px 4px;text-align:center;font-size:15px}
textarea{width:100%;background:#050b1c;border:1px solid var(--line);color:#fff;padding:11px;font:inherit;font-size:14px;outline:none;min-height:74px;resize:vertical}
textarea:focus{box-shadow:0 0 8px var(--glow)}

.pop{background:rgba(3,6,14,.84)}
.pc{width:100%;max-width:390px;background:#0c1322;border:1px solid #1f2d4d;border-radius:16px;padding:30px 24px 22px;text-align:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 24px rgba(47,109,240,.18);animation:pin .28s ease-out}
.pic{color:#5b9dff;margin-bottom:10px;display:flex;justify-content:center}
.pt{font-size:26px;font-weight:800;color:#5b9dff;letter-spacing:.5px;margin-bottom:14px}
.ps{font-size:17px;font-weight:800;color:#fff;text-transform:uppercase;margin-bottom:14px}
.pm{font-size:14px;color:#fff;margin-bottom:10px}
.pb{font-size:14px;color:#c9d4ec;line-height:1.5;margin:0 4px 6px}
.px{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #26334f;margin-top:18px;padding-top:14px;font-size:13.5px;color:#c9d4ec}
.px b{color:#5b9dff;font-size:14.5px}
.pc #pok{width:100%;margin-top:18px;background:#2f6df0;border:0;border-radius:10px;padding:15px;font:700 14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#fff;box-shadow:none}
.pc #pok:hover,.pc #pok:active{background:#3f7bff;box-shadow:none}
@keyframes pin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
#upd{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:50;background:#0c1322;border:1px solid #2f6df0;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:13px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;box-shadow:0 0 16px rgba(47,109,240,.4)}
#upd button{background:#2f6df0;border:0;border-radius:8px;padding:10px 16px;color:#fff;font:700 12px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.4px;text-transform:uppercase;box-shadow:none;flex:none}
#ci{position:fixed;inset:0;z-index:25;background:rgba(3,6,14,.97);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.pc.form{text-align:left;margin:auto}
.pc.form label{margin-top:14px}
.pbtn{width:100%;margin-top:16px;background:#2f6df0;border:0;border-radius:10px;padding:15px;font:700 14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#fff;box-shadow:none}
.pbtn:disabled{background:#1b2a4d;color:#6f84b3;opacity:1}
.pbtn.ghost{background:transparent;border:1px solid #2b3a5e;color:#c9d4ec;margin-top:10px}
#ach{position:fixed;inset:0;z-index:35;background:rgba(3,6,14,.96);display:flex;padding:20px;overflow:auto}
#ach .pc{margin:auto}
</style>
</head>

const RANKS=['E','D','C','B','A','S'];

const DIFF={easy:{n:'Easy',t:50,d:'Target 50/hari'},medium:{n:'Medium',t:100,d:'Target 100/hari'},hard:{n:'Hard',t:200,d:'Target 200/hari'},extreme:{n:'Extreme',t:300,d:'Target 300/hari'}};
const MOVES=[

if(S){S.ach=S.ach||0;S.achs=S.achs||[];S.ci=S.ci||{days:30};S.seen=S.seen||{lv:1,rk:0};S.sched=S.sched||DEFSCHED.slice();S.sess=S.sess||{};if(!S.quests)S.quests=[{id:'q0',mv:'pushup',t:DIFF[S.diff].t}];S.qseen=S.qseen||['pushup'];S.hidden=S.hidden||[];S.custom=S.custom||[];S.mvLv=S.mvLv||{}}

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}

/* ---- game logic ---- */
const levelOf=x=>Math.floor(Math.sqrt(x/50))+1;
const levelStart=l=>50*(l-1)*(l-1);
function rankOf(x,d){const st=STEPS[d];let c=0,r=0;for(let i=0;i<st.length;i++){c+=st[i];if(x>=c)r=i+1}return r}
function rankBounds(x,d){const st=STEPS[d];let c=0;for(let i=0;i<st.length;i++){if(x<c+st[i])return[c,c+st[i]];c+=st[i]}return[c,c]}
function allMoves(){return MOVES.filter(m=>!S.hidden.includes(m.id)).concat(S.custom)}
function lvOf(m){return (S.mvLv&&S.mvLv[m.id])||m.lv||0}
function lockMsg(m){if(ORD.indexOf(S.diff)<ORD.indexOf(m.min))return '[Terkunci] Khusus '+DIFF[m.min].n+' ke atas';if(m.rankOnlyEasy&&S.diff==='easy'&&rankOf(S.exp,S.diff)<m.rank)return '[Terkunci] Capai Rank '+RANKS[m.rank];return '[Terkunci] Capai Level '+lvOf(m)}
function unlocked(m,st=S){const di=ORD.indexOf(st.diff);if(di<ORD.indexOf(m.min))return false;if(lvOf(m)>levelOf(st.exp))return false;
 if(m.rankOnlyEasy&&st.diff==='easy')return rankOf(st.exp,st.diff)>=m.rank;return true}
function dayRec(){const k=today();const d=S.days[k]||(S.days[k]={pushup:0,exp:0});if(!d.m)d.m={};return d}
function cnt(day,id){return id==='pushup'?day.pushup:((day.m&&day.m[id])||0)}
function syncQuests(){let ch=false;allMoves().forEach(m=>{if(!S.qseen.includes(m.id)&&unlocked(m)){S.qseen.push(m.id);if(!S.quests.some(q=>q.mv===m.id))S.quests.push({id:'q'+m.id,mv:m.id,t:m.u==='menit'?20:30});ch=true}});if(ch)save()}
function snap(){return{l:levelOf(S.exp),r:rankOf(S.exp,S.diff),open:allMoves().filter(x=>unlocked(x)).map(x=>x.id)}}
function fmtMsg(t,o){return esc(t).replace(/\{(\w+)\}/g,(x,k)=>o[k]!=null?o[k]:x).replace(/\n/g,'<br>')}
function msgOf(){return Object.assign({},DEFMSG,S.msgs||{})}
function msgParts(t,o){const L=String(t||'').split('\n');return [fmtMsg(L[0],o),fmtMsg(L.slice(1).join('\n').trim(),o)]}
function lvItem(f,t,o,xp,txt){const m=msgParts(txt,o);return ['LEVEL UP!',`Level ${f} → Level ${t}`,m[0],xp,'level',m[1]]}
function rkItem(f,t,o,xp,txt){const m=msgParts(txt,o);return ['RANK UP!',`Rank ${RANKS[f]} → Rank ${RANKS[t]}`,m[0],xp,'rank',m[1]]}
function milestoneQ(){
 if(!S.seen)S.seen={lv:1,rk:0};
 const lv=levelOf(S.exp),rk=rankOf(S.exp,S.diff),q=[],M=msgOf(),o={nama:S.name,lv:lv,rank:RANKS[rk],exp:Math.floor(S.exp)};
 if(rk>S.seen.rk)q.push(rkItem(S.seen.rk,rk,o,null,M.rk));
 if(lv>S.seen.lv){q.push(lvItem(S.seen.lv,lv,o,null,M.lv));
  S.rewards.filter(r=>r.lv>S.seen.lv&&r.lv<=lv).sort((a,b)=>a.lv-b.lv).forEach(r=>q.push(['HADIAH TERBUKA!',`Level ${r.lv}`,esc(r.text),null,'reward','Kamu sudah layak mendapatkannya. Nikmati hadiahmu!']))}
 if(lv!==S.seen.lv||rk!==S.seen.rk){S.seen={lv:Math.max(lv,S.seen.lv),rk:Math.max(rk,S.seen.rk)};save()}
 return q}
function applyGain(gain,msg,before,extra){
 const day=dayRec();gain=Math.round(gain*10)/10;S.exp=Math.round((S.exp+gain)*10)/10;day.exp=Math.round((day.exp+gain)*10)/10;
 save();toast(`+${gain} EXP  (${msg})`);
 const q=(extra||[]).slice();
 allMoves().filter(x=>unlocked(x)&&!before.open.includes(x.id)).forEach(x=>q.push(['GERAKAN BARU',x.n,'Gerakan baru terbuka!',null,'move','Kamu bisa langsung mencobanya di tab Latihan.']));
 milestoneQ().forEach(x=>q.push(x));
 q.forEach(x=>{if(/LEVEL|RANK|CLEAR|SESI/.test(x[0])&&x[3]==null)x[3]=gain});
 showQ(q);render();
}

function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.exp!=='number'||!d.name||!d.diff)throw 0;if(!confirm('Pulihkan data dari cadangan? Data saat ini akan diganti.'))return;localStorage.setItem('sysq',JSON.stringify(d));location.reload()}catch(e){toast('File cadangan tidak valid')}};r.readAsText(f)}

 <div style="position:relative;height:12px;margin:16px 0 4px;background:linear-gradient(90deg,#ffc857 0 14%,#3de0a0 14% 38%,#ffc857 38% 62%,#ff5c7a 62%);opacity:.9"><i style="position:absolute;top:-5px;left:${pos}%;width:3px;height:22px;background:#fff;box-shadow:0 0 8px #fff"></i></div>
 <div class="small" style="display:flex;justify-content:space-between"><span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span></div>
 <div class="small" style="margin-top:8px">BMI hanya perkiraan kasar dan tidak membedakan otot dari lemak. Update berat di tab Progres supaya BMI ikut berubah.</div></div>`}
function settingView(){
 const mv=allMoves(),hid=MOVES.filter(m=>S.hidden.includes(m.id));
 return questSet()+msgPanel()+ciSet()+heroSet()+`<div class="panel"><h3>Kelola Gerakan</h3><div class="small" style="margin-bottom:6px">Atur level minimal untuk membuka tiap gerakan. Push Up tidak bisa dihapus karena dipakai penghitung otomatis.</div>${mv.map(m=>`<div class="mv"><div><div class="n">${esc(m.n)}</div><div class="small">${m.x} EXP / ${m.u}</div></div><div class="row" style="flex:none;gap:6px"><div style="text-align:center"><div class="small">Buka di Lv</div><input type="number" min="0" data-lv="${m.id}" value="${lvOf(m)}"></div>${m.id==='pushup'?'':`<button class="danger" data-rm="${m.id}">Hapus</button>`}</div></div>`).join('')}</div>
 <div class="panel"><h3>Tambah Gerakan</h3><label>NAMA</label><input id="mn" placeholder="mis. Sit Up"><div class="row"><div><label>SATUAN</label><select id="mu"><option>repetisi</option><option>menit</option></select></div><div><label>EXP/SATUAN</label><input id="mx" type="number" step="0.1" inputmode="decimal" value="1"></div><div><label>BUKA DI LV</label><input id="ml" type="number" inputmode="numeric" value="1"></div></div><button class="big" id="madd" style="margin-top:10px">Tambah Gerakan</button></div>
 ${hid.length?`<div class="panel"><h3>Gerakan Dihapus</h3>${hid.map(m=>`<div class="mv"><span>${m.n}</span><button data-rs="${m.id}">Pulihkan</button></div>`).join('')}</div>`:''}
 <div class="panel"><h3>Cadangan Data</h3><div class="small" style="margin-bottom:8px">Simpan semua progres (level, EXP, foto, jadwal) ke file di HP. Berguna sebelum pasang ulang aplikasi atau ganti HP.</div><button class="big" id="bk">Simpan Cadangan</button><label>PULIHKAN DARI FILE CADANGAN</label><input type="file" id="bkf" accept=".json,application/json"></div>
 <div class="panel"><h3>Data</h3><button class="danger big" id="reset">Reset Semua Data</button><div class="small" style="margin-top:10px;text-align:center">Versi aplikasi: ${VERSION}</div></div>`}
function rewardView(lv){
 const rs=[...S.rewards].sort((a,b)=>a.lv-b.lv);
 return `<div class="panel"><h3>Tambah Hadiah</h3><div class="row"><input id="rl" type="number" inputmode="numeric" placeholder="Level" style="flex:.5"><input id="rt" placeholder="Hadiah, mis. makan es krim"></div><button class="big" id="radd" style="margin-top:10px">Simpan Hadiah</button></div>
 <div class="panel"><h3>Daftar Hadiah (Level kamu: ${lv})</h3>${rs.length?rs.map(r=>`<div class="rw ${lv>=r.lv?'open':''}"><div><b>Level ${r.lv}</b><div>${esc(r.text)}</div></div><div class="st">${lv>=r.lv?'TERBUKA ✔':'Terkunci'}<br><button data-del="${r.id}" class="danger" style="padding:4px 8px;margin-top:4px">Hapus</button></div></div>`).join(''):'<div class="small">Belum ada hadiah.</div>'}</div>`}
function progView(){
 const f=S.photos[0],l=S.photos[S.photos.length-1],keys=Object.keys(S.days).sort().slice(-7).reverse();
 return chartPanel()+`<div class="panel"><h3>Perbandingan Foto</h3><div class="photos"><div><img src="${f.img}"><br>AWAL · ${f.d}<br>${f.w} kg</div><div>${S.photos.length>1?`<img src="${l.img}"><br>TERBARU · ${l.d}<br>${l.w} kg`:'<div class="small" style="padding:60px 6px">Tambah foto progres untuk dibandingkan</div>'}</div></div>
 ${S.photos.length>1?`<div class="small" style="margin-top:8px;text-align:center">Perubahan berat: ${(l.w-f.w>0?'+':'')}${(l.w-f.w).toFixed(1)} kg</div>`:''}</div>
 ${achPanel()}${histPanel()}<div class="panel"><h3>Foto Progres Baru</h3><label>BERAT SEKARANG (KG)</label><input id="pw" type="number" inputmode="decimal" value="${S.w}"><label>FOTO FULL BODY</label><input id="pf" type="file" accept="image/*"><button class="big" id="padd" style="margin-top:10px">Simpan Foto</button></div>
 <div class="panel"><h3>7 Hari Terakhir</h3>${keys.length?keys.map(k=>`<div class="mv"><span>${k}</span><span>${S.days[k].pushup} push up · ${S.days[k].exp} EXP</span></div>`).join(''):'<div class="small">Belum ada latihan.</div>'}</div>`}

function bind(){
 const g=id=>document.getElementById(id);
 if(g('auto'))g('auto').onclick=()=>startCounter();
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const i=g('in-'+b.dataset.add),n=parseFloat(i.value);if(!(n>0))return toast('Isi jumlah dulu');addReps(b.dataset.add,n);i.value=''});
 if(g('radd'))g('radd').onclick=()=>{const lv=parseInt(g('rl').value),t=g('rt').value.trim();if(!(lv>0)||!t)return toast('Isi level dan hadiah');S.rewards.push({id:Date.now(),lv,text:t});save();render()};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.rewards=S.rewards.filter(r=>r.id!=b.dataset.del);save();render()});
 if(g('padd'))g('padd').onclick=async()=>{const img=await readPhoto(g('pf').files[0]),w=parseFloat(g('pw').value);if(!img)return toast('Pilih foto dulu');if(!(w>20))return toast('Berat tidak valid');S.w=w;S.photos.push({d:today(),w,img});save();toast('Foto progres tersimpan');render()};
 document.querySelectorAll('[data-ex]').forEach(i=>i.oninput=()=>{const ss=getSess();if(!ss)return;const id=i.dataset.ex,k=+i.dataset.k,a=ss.sets[id]||(ss.sets[id]=[]);for(let j=0;j<k;j++)if(a[j]==null)a[j]=0;a[k]=Math.max(0,parseFloat(i.value)||0);save();liveExp()});
 document.querySelectorAll('[data-w]').forEach(i=>i.onchange=()=>{const ss=getSess();if(ss){ss.warm[+i.dataset.w]=i.checked;save()}});
 document.querySelectorAll('[data-cl]').forEach(i=>i.onchange=()=>{const ss=getSess();if(ss){ss.cool[+i.dataset.cl]=i.checked;save()}});
 document.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{const ss=getSess(),id=b.dataset.addset;ss.ns=ss.ns||{};ss.ns[id]=(ss.ns[id]||3)+1;save();render()});
 if(g('scam'))g('scam').onclick=()=>startCounter(n=>fillSet('pushup',n));
 if(g('sfin'))g('sfin').onclick=finishSess;
 if(g('scan'))g('scan').onclick=()=>{if(confirm('Batalkan sesi ini? Catatan set yang sudah diisi akan dihapus.')){delete S.sess[today()];save();render()}};
 if(g('pstart'))g('pstart').onclick=()=>startSess(g('pt').value);
 document.querySelectorAll('[data-sd]').forEach(x=>x.onchange=()=>{S.sched[+x.dataset.sd]=x.value;save();render()});
 document.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{S.sched=PRE[+b.dataset.pre].slice();save();toast('Jadwal diterapkan');render()});
 if(g('sx'))liveExp();
 if(g('msave'))g('msave').onclick=()=>{S.msgs={lv:g('mlv').value.trim()||DEFMSG.lv,rk:g('mrk').value.trim()||DEFMSG.rk};save();toast('Pesan disimpan')};
 if(g('mdef'))g('mdef').onclick=()=>{delete S.msgs;save();toast('Pesan dikembalikan');render()};
 if(g('mtl'))g('mtl').onclick=()=>{const lv=levelOf(S.exp)+1;showQ([lvItem(lv-1,lv,{nama:S.name,lv:lv,rank:RANKS[rankOf(S.exp,S.diff)],exp:Math.floor(S.exp)},125,g('mlv').value||DEFMSG.lv)])};
 if(g('mtr'))g('mtr').onclick=()=>{const r=rankOf(S.exp,S.diff),n=Math.min(5,r+1);showQ([rkItem(r,n,{nama:S.name,lv:levelOf(S.exp),rank:RANKS[n],exp:Math.floor(S.exp)},125,g('mrk').value||DEFMSG.rk)])};
 if(g('cinow'))g('cinow').onclick=()=>showCheckin(true);
 document.querySelectorAll('[data-poster]').forEach(b=>b.onclick=()=>{const a=(S.achs||[]).find(z=>z.m==b.dataset.poster);if(a)showAch(a)});
 if(g('heroin'))g('heroin').onchange=async()=>{const d=await readHero(g('heroin').files[0]);if(!d)return toast('Gambar tidak valid');S.hero=d;save();toast('Gambar poster disimpan');render()};
 if(g('herodel'))g('herodel').onclick=()=>{S.hero=null;save();render()};
 if(g('herotest'))g('herotest').onclick=()=>showAch({m:1000,d:today(),name:S.name,lv:levelOf(S.exp),rk:rankOf(S.exp,S.diff),preview:true});
 if(g('cid'))g('cid').onchange=()=>{S.ci=S.ci||{};S.ci.days=+g('cid').value;save();toast('Pengingat diubah');render()};
 if(g('bk'))g('bk').onclick=exportData;
 if(g('bkf'))g('bkf').onchange=()=>importData(g('bkf').files[0]);
 document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{CH.p=b.dataset.cp;render()});
 document.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{CH.m=b.dataset.cm;render()});
 document.querySelectorAll('[data-qt]').forEach(i=>i.onchange=()=>{const q=S.quests.find(x=>x.id===i.dataset.qt);if(q){q.t=Math.max(1,parseInt(i.value)||1);save();toast('Target diubah')}});
 document.querySelectorAll('[data-qd]').forEach(b=>b.onclick=()=>{S.quests=S.quests.filter(x=>x.id!==b.dataset.qd);save();render()});
 if(g('qadd'))g('qadd').onclick=()=>{const m=g('qm').value,t=parseInt(g('qv').value);if(!m||!(t>0))return toast('Isi target dengan benar');S.quests.push({id:'q'+m+Date.now(),mv:m,t});save();toast('Quest ditambahkan');render()};
 document.querySelectorAll('[data-lv]').forEach(i=>i.onchange=()=>{S.mvLv[i.dataset.lv]=Math.max(0,parseInt(i.value)||0);save();toast('Level buka diubah')});
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const id=b.dataset.rm;if(!confirm('Hapus gerakan ini? EXP yang sudah didapat tetap aman.'))return;if(S.custom.some(m=>m.id===id))S.custom=S.custom.filter(m=>m.id!==id);else S.hidden.push(id);save();render()});
 document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{S.hidden=S.hidden.filter(x=>x!==b.dataset.rs);save();render()});
 if(g('madd'))g('madd').onclick=()=>{const n=g('mn').value.trim(),x=parseFloat(g('mx').value),l=parseInt(g('ml').value)||0;if(!n||!(x>0))return toast('Isi nama dan EXP dengan benar');S.custom.push({id:'c'+Date.now(),n,u:g('mu').value,x,min:'easy',rank:0,lv:Math.max(0,l)});save();toast('Gerakan ditambahkan');render()};
 if(g('reset'))g('reset').onclick=()=>{if(confirm('Hapus semua data? Tidak bisa dibatalkan.')){try{localStorage.removeItem('sysq')}catch(e){}S=null;render()}};
}

/* ---- auto counter (camera brightness) ---- */
let CT=null;
async function startCounter(cb){
 const ov=$('#ov');let count=0,near=false,base=0,t0=Date.now(),stream=null,wl=null,sens=.5,lastLevel=0,vt=null;
 ov.innerHTML=`<div class="tag">[ PUSH UP COUNTER ]</div><div id="cnt">0</div><div id="stat" class="far">KALIBRASI...</div><div class="small" id="info" style="margin-bottom:12px"></div>
 <div style="width:100%;max-width:340px"><label>SENSITIVITAS <span id="sv"></span></label><input type="range" id="sl" min="25" max="75" value="50">
 <div class="row" style="margin-top:14px"><button id="cal">Kalibrasi ulang</button><button id="tap">+1 Manual</button></div><button id="mute" style="margin-top:10px">Suara: ${S.mute?'MATI':'HIDUP'}</button>
 <button class="big" id="fin" style="margin-top:12px">Selesai & Simpan</button><button id="cancel" class="danger big" style="margin-top:10px">Batal</button></div><video id="vid" playsinline muted></video>`;
 ov.classList.add('show');beep(500,.05);
 const set=(id,v)=>{const e=document.getElementById(id);if(e)e.innerHTML=v};
 const tickUI=()=>set('cnt',count);
 const onRep=()=>{if(S.mute){beep(700,.08);return}clearTimeout(vt);if(count%10===0){say(count+'. Istirahat sebentar, semangat!');const c=count;vt=setTimeout(()=>{if(count===c)say('Ayo, lanjut!')},9000)}else say(String(count))};
 document.getElementById('mute').onclick=()=>{S.mute=!S.mute;save();set('mute','Suara: '+(S.mute?'MATI':'HIDUP'));if(!S.mute)say('Suara hidup');else try{speechSynthesis.cancel()}catch(e){}};
 try{if(window.speechSynthesis&&!S.mute){const w=new SpeechSynthesisUtterance(' ');w.volume=0;speechSynthesis.speak(w)}}catch(e){}
 const sl=document.getElementById('sl');sl.oninput=()=>{sens=sl.value/100;set('sv',sl.value+'%')};set('sv','50%');
 try{if(!navigator.mediaDevices)throw 0;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:160,height:120},audio:false});
  const v=document.getElementById('vid');v.srcObject=stream;await v.play();
  try{wl=await navigator.wakeLock.request('screen')}catch(e){}
  const c=document.createElement('canvas');c.width=32;c.height=24;const x=c.getContext('2d',{willReadFrequently:true});let hist=[],calEnd=Date.now()+2500,mx=0;
  document.getElementById('cal').onclick=()=>{calEnd=Date.now()+2500;mx=0;near=false;set('stat','KALIBRASI...');base=0};
  CT=setInterval(()=>{x.drawImage(v,0,0,32,24);const d=x.getImageData(0,0,32,24).data;let s=0;for(let i=0;i<d.length;i+=4)s+=d[i]*.3+d[i+1]*.59+d[i+2]*.11;const b=s/(d.length/4);
   set('info',`Cahaya: ${b.toFixed(0)} · Dasar: ${base.toFixed(0)}`);
   if(Date.now()<calEnd){mx=Math.max(mx,b);base=mx;return}
   if(base<8){set('stat','TERLALU GELAP');return}
   const lo=base*(.2+sens*.5),hi=base*(.3+sens*.55);
   if(!near&&b<lo){near=true;set('stat','DEKAT');document.getElementById('stat').className='near'}
   else if(near&&b>hi){near=false;count++;tickUI();onRep();if(navigator.vibrate)navigator.vibrate(30);set('stat','JAUH');document.getElementById('stat').className='far'}
   else if(!near&&document.getElementById('stat').textContent==='KALIBRASI...'){set('stat','SIAP - MULAI PUSH UP')}
  },60);set('stat','KALIBRASI...');setTimeout(()=>{if(document.getElementById('stat')&&near===false)set('stat','SIAP - MULAI PUSH UP')},2600);
 }catch(e){set('stat','KAMERA TIDAK TERSEDIA');set('info','Izinkan kamera, atau pakai tombol +1 Manual / ketuk angka.')}
 document.getElementById('tap').onclick=()=>{count++;tickUI();onRep()};
 document.getElementById('cnt').onclick=()=>{count++;tickUI();onRep()};
 const stop=()=>{clearInterval(CT);clearTimeout(vt);try{speechSynthesis.cancel()}catch(e){}if(stream)stream.getTracks().forEach(t=>t.stop());try{wl&&wl.release()}catch(e){}ov.classList.remove('show');ov.innerHTML=''};
 document.getElementById('cancel').onclick=stop;
 document.getElementById('fin').onclick=()=>{const n=count;stop();if(n>0){if(cb)cb(n);else addReps('pushup',n)}else toast('Belum ada push up terhitung')};
}
function showUpdate(){if(document.getElementById('upd'))return;const d=document.createElement('div');d.id='upd';d.innerHTML='<span>Versi baru tersedia</span><button id="updb">Perbarui</button>';document.body.appendChild(d);
 document.getElementById('updb').onclick=async()=>{try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));const rg=await navigator.serviceWorker.getRegistration();if(rg)await rg.update()}catch(e){}location.reload()}}
async function checkUpdate(){try{const r=await fetch('index.html?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text(),m=t.match(/const VERSION='([^']*)'/);if(m&&m[1]!==VERSION)showUpdate()}catch(e){}}
render();
setTimeout(checkUpdate,1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
if('serviceWorker' in navigator){
 const had=!!navigator.serviceWorker.controller;let rl=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()})}).catch(()=>{});
}
</script>
